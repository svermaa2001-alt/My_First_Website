<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dr. Seema Verma | Portfolio</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:linear-gradient(to right,#141e30,#243b55);
            color:white;
        }

        .main-layout{
            display:flex;
            min-height:100vh;
        }

        /* LEFT PROFILE SECTION */

        .profile-section{
            width:35%;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:40px;
            text-align:center;
        }

        .profile-section img{
            width:170px;
            height:170px;
            border-radius:50%;
            border:4px solid white;
            margin-bottom:25px;
        }

        .profile-section h1{
            font-size:40px;
            margin-bottom:15px;
            line-height:65px;
        }

        .profile-section h3{
            font-size:18px;
            color:#00ffd5;
            margin-bottom:25px;
        }

        .profile-section p{
            font-size:14px;
            line-height:32px;
            width:100%;
            margin-bottom:30px;
        }

        .profile-section button{
            padding:14px 30px;
            border:none;
            border-radius:30px;
            background:#00ffd5;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        .profile-section button:hover{
            background:white;
        }

        /* RIGHT DASHBOARD SECTION */

        .dashboard-section{
            width:65%;
            padding:25px;
        }

        .dashboard-section h2{
            text-align:center;
            font-size:38px;
            margin-bottom:20px;
        }

        iframe{
            width:100%;
            height:90vh;
            border:none;
            border-radius:10px;
            background:white;
        }

        /* RESPONSIVE DESIGN */

        @media(max-width:900px){

            .main-layout{
                flex-direction:column;
            }

            .profile-section,
            .dashboard-section{
                width:100%;
            }

            .profile-section h1{
                font-size:42px;
                line-height:55px;
            }

            iframe{
                height:700px;
            }
        }

    </style>

</head>

<body>

    <div class="main-layout">

        <!-- LEFT PROFILE SECTION -->

        <div class="profile-section">

            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile Photo">

            <h1>Dr. Seema Verma</h1>

            <h3>
                Professor | AI Researcher | Innovator
            </h3>

            <p>
                Welcome to my portfolio website.
                I work in Artificial Intelligence,
                Machine Learning, Generative AI,
                and Emerging Technologies.
            </p>

            <button>
                Contact Me
            </button>

        </div>

        <!-- RIGHT DASHBOARD SECTION -->

        <div class="dashboard-section">

            <h2>IPL Analytics Dashboard</h2>

            <iframe
                src="https://public.tableau.com/views/IPLAnalyticsDashboard_17797754701500/Dashboard1?:language=en-US&publish=yes&:display_count=n&:origin=viz_share_link&:showVizHome=no">
            </iframe>

        </div>

    </div>

</body>

</html>
